name: Build and publish image

# Building on the server took 10-20 minutes on a disk that is already saturated,
# and Portainer cannot pull a locally built image, so redeploys failed outright.
# GitHub builds it instead and the server just pulls.

on:
  push:
    branches: [main]
    paths:
      - "athx-tracker/**"
      - "estimator/**"
      - ".github/workflows/build.yml"
      # Prose does not change the image, and publishing one makes the server
      # redeploy itself. A README is not worth restarting production for.
      - "!**/*.md"
  workflow_dispatch:

jobs:
  # The image is published to :latest and the server redeploys itself from it
  # within five minutes, so nothing between a bad push and production asks any
  # questions. A type error already fails the image build, since that runs next
  # build; these are the failures that compile perfectly well.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: athx-tracker/package-lock.json
      - run: npm ci
        working-directory: athx-tracker
      - run: npm run lint
        working-directory: athx-tracker
      - run: npm test
        working-directory: athx-tracker
      # Every bug that reached a phone in this app was wiring or rendering,
      # which the unit tests cannot see. These drive a real browser.
      #
      # --with-deps spent five minutes of every run in apt, against seventy
      # seconds of actual testing, and the image it runs on already carries
      # what headless chromium needs. Only the browser has to arrive, and only
      # when the cache misses. Keyed on the lockfile, so a Playwright upgrade
      # fetches the matching build instead of reusing the old one.
      - name: Cache the browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('athx-tracker/package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.browser.outputs.cache-hit != 'true'
        working-directory: athx-tracker
      - run: npm run test:e2e
        working-directory: athx-tracker

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The server's architecture is not known here, so publish for both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./athx-tracker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Layer cache between runs, so later builds are minutes not tens of them.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish the estimator
        uses: docker/build-push-action@v6
        with:
          context: ./estimator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jxxu96/athx-estimator:latest
          cache-from: type=gha,scope=estimator
          cache-to: type=gha,mode=max,scope=estimator

      # Kept for a reachable Portainer. GitHub runners cannot route to a tailnet
      # address, so with Portainer on one this no-ops and the estimator on your
      # own machine watches the registry and triggers the redeploy instead.
      - name: Tell Portainer the image is ready
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "PORTAINER_WEBHOOK not set; skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Portainer redeploy triggered."
