name: Build and publish image

# Building on the server took 10-20 minutes on a disk that is already saturated,
# and Portainer cannot pull a locally built image, so redeploys failed outright.
# GitHub builds it instead and the server just pulls.

on:
  push:
    branches: [main]
    paths:
      - "athx-tracker/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The server's architecture is not known here, so publish for both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./athx-tracker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Layer cache between runs, so later builds are minutes not tens of them.
          cache-from: type=gha
          cache-to: type=gha,mode=max
