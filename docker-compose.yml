services:
  athx-tracker:
    # Built and published by .github/workflows/build.yml. Not built here: this
    # host took 10-20 minutes to build it, and Portainer cannot pull an image
    # that only ever existed locally, which made every redeploy fail.
    image: ghcr.io/jxxu96/athx-tracker:latest
    # Portainer recreates the container but will not re-fetch a tag it already
    # has on disk, and its Re-pull image toggle is a paid feature. Without this,
    # every redeploy restarts the same stale image and looks like it worked.
    pull_policy: always
    container_name: athx-tracker
    restart: unless-stopped
    environment:
      # The shared passphrase both of you type to open the journal.
      # Changing it signs every device out.
      APP_PASSPHRASE: ${APP_PASSPHRASE:?set APP_PASSPHRASE in your stack environment}
      # Optional: enables macro estimates. Leave all four unset to enter macros
      # by hand. A variable set on the stack but absent here never reaches the
      # container, so every one the app reads has to be listed.
      #
      # The estimator below, reached over the compose network. Override
      # GROK_GATEWAY_URL to point at an estimator on your own machine instead.
      GROK_GATEWAY_URL: ${GROK_GATEWAY_URL:-http://estimator:8787}
      GROK_GATEWAY_TOKEN: ${GROK_GATEWAY_TOKEN:?set GROK_GATEWAY_TOKEN, matching the estimator}
      # Or the x.ai API directly, which is billed per token.
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
    volumes:
      # The journal is one SQLite file. Back this volume up and you have everything.
      - athx-data:/data
    ports:
      # Bound to loopback, so the only way in is `tailscale serve` on the host:
      # not the LAN, not the internet. Set ATHX_BIND=0.0.0.0 if Tailscale runs
      # in a container rather than on the host, or to reach it from the LAN.
      - "${ATHX_BIND:-127.0.0.1}:${ATHX_PORT:-3000}:3000"

  estimator:
    image: ghcr.io/jxxu96/athx-estimator:latest
    pull_policy: always
    container_name: athx-estimator
    restart: unless-stopped
    environment:
      # Must match GROK_GATEWAY_TOKEN above.
      ESTIMATOR_TOKEN: ${GROK_GATEWAY_TOKEN:?set GROK_GATEWAY_TOKEN, matching the app}
      # Claude first, matching the estimator's own default and the reason for
      # it: whoever runs first gets the large slice of the budget and the one
      # that follows gets what is left. Grok leading took its full 31s and left
      # Claude about 9s, too little from a cold container, so both timed out and
      # the whole 40s budget burned for no answer.
      ESTIMATOR_ORDER: ${ESTIMATOR_ORDER:-claude,grok}
      # Auto-redeploy. GitHub Actions cannot reach a tailnet address, so CI
      # cannot call Portainer. This container can: it watches ghcr.io for a new
      # image and calls the webhook below. It runs beside Portainer and is
      # always up, which an estimator on a laptop is not. Unset means redeploys
      # stay manual. Get the URL from the stack's GitOps updates panel, and use
      # host.docker.internal as its host: inside here, localhost is this
      # container, not the server.
      DEPLOY_WEBHOOK: ${DEPLOY_WEBHOOK:-}
      DEPLOY_IMAGE: ${DEPLOY_IMAGE:-jxxu96/athx-tracker}
      DEPLOY_EVERY_MINUTES: ${DEPLOY_EVERY_MINUTES:-5}
    # Lets DEPLOY_WEBHOOK reach Portainer on the host without depending on the
    # tailnet routing, or a firewall rule, from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Holds the CLI logins. Sign in once with docker exec; this keeps it.
      - estimator-config:/config
    # Deliberately not published: only the app, on this network, can reach it.
    expose:
      - "8787"

volumes:
  athx-data:
  estimator-config:
